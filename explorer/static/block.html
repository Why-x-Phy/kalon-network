<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block - Kalon Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <h1><a href="index.html" style="color: inherit; text-decoration: none;">Kalon Explorer</a></h1>
            </div>
            <div class="header-right">
                <div id="onlineStatus" class="status-offline">● OFFLINE</div>
                <nav class="nav">
                    <a href="index.html">Explorer</a>
                    <a href="stats.html">Stats</a>
                </nav>
                <div class="search">
                    <input type="text" placeholder="Search blocks, transactions or wallet addresses">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <!-- Block Details -->
    <section class="content">
        <div class="container">
            <h2 class="section-title" id="blockTitle">Loading block...</h2>
            
            <div class="block-details">
                <div class="detail-row">
                    <div class="detail-label">Block Hash</div>
                    <div class="detail-value" id="blockHash">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Parent Hash</div>
                    <div class="detail-value" id="parentHash">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Block Reward</div>
                    <div class="detail-value" id="blockReward">5.00 tKALON</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Difficulty</div>
                    <div class="detail-value" id="difficulty">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Timestamp</div>
                    <div class="detail-value" id="timestamp">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Miner</div>
                    <div class="detail-value" id="miner">-</div>
                </div>
                <div class="detail-row">
                    <div class="detail-label">Nonce</div>
                    <div class="detail-value" id="nonce">-</div>
                </div>
            </div>

            <h3 class="section-title" style="margin-top: 48px; font-size: 22px;">Transactions in this block</h3>
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>TXID</th>
                            <th>From</th>
                            <th>To</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="txTable">
                        <tr>
                            <td colspan="4" style="text-align: center; padding: 40px; color: #666;">
                                No transactions in this block
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <script src="config.js"></script>
    <script>
        // RPC Server URL (konfigurierbar)
        const RPC_URL = window.RPC_URL || 'http://localhost:16316';
        const RPC_ENDPOINT = `${RPC_URL}/rpc`;

        // Online Status
        let statusCheckInterval = null;

        // Check connection status (for green/red indicator)
        async function checkConnectionStatus() {
            try {
                const response = await fetch(RPC_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: 'getHeight',
                        id: 1
                    })
                });
                
                const data = await response.json();
                if (data.result !== undefined) {
                    updateOnlineStatus(true);
                } else {
                    updateOnlineStatus(false);
                }
            } catch (error) {
                console.error('Connection check failed:', error);
                updateOnlineStatus(false);
            }
        }

        // Update online status indicator
        function updateOnlineStatus(online) {
            const statusIndicator = document.getElementById('onlineStatus');
            if (statusIndicator) {
                statusIndicator.className = online ? 'status-online' : 'status-offline';
                statusIndicator.textContent = online ? '● ONLINE' : '● OFFLINE';
            }
        }

        // Call RPC method
        async function callRPC(method, params = {}) {
            try {
                const response = await fetch(RPC_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        method: method,
                        params: params,
                        id: 1
                    })
                });
                
                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message || 'RPC Error');
                }
                return data.result;
            } catch (error) {
                console.error(`RPC call failed (${method}):`, error);
                throw error;
            }
        }

        // Get block hash or number from URL
        const params = new URLSearchParams(window.location.search);
        const hash = params.get('h');
        const number = params.get('n');
        
        // Start online status checking
        checkConnectionStatus();
        statusCheckInterval = setInterval(checkConnectionStatus, 5000);
        
        if (hash) {
            // Load block details by hash
            loadBlockDetailsByHash(hash);
        } else if (number) {
            // Load block details by number
            loadBlockDetailsByNumber(parseInt(number, 10));
        } else {
            // No hash or number provided, show error
            document.getElementById('blockTitle').textContent = 'Error: No block hash or number provided';
            document.getElementById('blockHash').textContent = 'Please provide a block hash (?h=...) or block number (?n=...)';
        }

        async function loadBlockDetailsByHash(blockHash) {
            try {
                // Remove "0x" prefix if present
                const cleanHash = blockHash.startsWith('0x') ? blockHash.substring(2) : blockHash;
                
                // Try to get block by hash
                const block = await callRPC('getBlockByHash', { hash: cleanHash });
                
                if (block) {
                    renderBlock(block);
                } else {
                    showError('Block not found');
                }
            } catch (error) {
                console.error('Error loading block:', error);
                updateOnlineStatus(false);
                showError(`Error loading block: ${error.message}`);
            }
        }

        async function loadBlockDetailsByNumber(blockNumber) {
            try {
                // Try to get block by number
                const block = await callRPC('getBlockByNumber', { number: blockNumber });
                
                if (block) {
                    renderBlock(block);
                } else {
                    showError('Block not found');
                }
            } catch (error) {
                console.error('Error loading block:', error);
                updateOnlineStatus(false);
                showError(`Error loading block: ${error.message}`);
            }
        }

        function showError(message) {
            document.getElementById('blockTitle').textContent = 'Error';
            document.getElementById('blockHash').textContent = message;
            document.getElementById('parentHash').textContent = '-';
            document.getElementById('blockReward').textContent = '-';
            document.getElementById('difficulty').textContent = '-';
            document.getElementById('timestamp').textContent = '-';
            document.getElementById('miner').textContent = '-';
            document.getElementById('nonce').textContent = '-';
            document.getElementById('txTable').innerHTML = `
                <tr>
                    <td colspan="4" style="text-align: center; padding: 40px; color: #f44336;">
                        ${message}
                    </td>
                </tr>
            `;
        }
        
        function renderBlock(block) {
            // Block title
            document.getElementById('blockTitle').textContent = `Block #${block.number || 'N/A'}`;
            
            // Block hash
            const blockHash = block.hash || '';
            document.getElementById('blockHash').textContent = formatHash(blockHash);
            
            // Parent hash
            const parentHash = block.parentHash || '';
            if (parentHash && block.number > 0) {
                document.getElementById('parentHash').innerHTML = `<a href="block.html?h=${block.parentHash}" class="hash-link">${formatHash(parentHash)}</a>`;
            } else {
                document.getElementById('parentHash').textContent = 'Genesis block';
            }
            
            // Block reward (fixed for now)
            document.getElementById('blockReward').textContent = '5.00 tKALON';
            
            // Difficulty
            document.getElementById('difficulty').textContent = formatNumber(block.difficulty || 0);
            
            // Timestamp
            const timestamp = block.timestamp;
            if (timestamp) {
                const date = new Date(timestamp * 1000);
                document.getElementById('timestamp').textContent = date.toLocaleString('de-DE');
            } else {
                document.getElementById('timestamp').textContent = 'N/A';
            }
            
            // Miner
            const miner = block.miner || '';
            if (miner) {
                // Try to convert to address format if it's a hex string
                const minerAddress = miner.startsWith('kalon1') ? miner : `kalon1${miner}`;
                document.getElementById('miner').innerHTML = `<a href="wallet.html?address=${encodeURIComponent(minerAddress)}" class="hash-link">${formatHash(miner)}</a>`;
            } else {
                document.getElementById('miner').textContent = 'N/A';
            }
            
            // Nonce
            document.getElementById('nonce').textContent = formatNumber(block.nonce || 0);
            
            // Render transactions
            const transactions = block.transactions || [];
            if (transactions.length > 0) {
                document.getElementById('txTable').innerHTML = transactions.map(tx => {
                    const txHash = tx.hash || '';
                    const fromAddr = tx.from || '';
                    const toAddr = tx.to || '';
                    const amount = tx.amount || 0;
                    
                    return `
                        <tr>
                            <td><a href="#" class="hash-link">${formatHash(txHash)}</a></td>
                            <td><a href="wallet.html?address=${encodeURIComponent(fromAddr)}" class="hash-link">${formatHash(fromAddr)}</a></td>
                            <td><a href="wallet.html?address=${encodeURIComponent(toAddr)}" class="hash-link">${formatHash(toAddr)}</a></td>
                            <td>${(amount / 1000000).toFixed(6)} tKALON</td>
                        </tr>
                    `;
                }).join('');
            } else {
                document.getElementById('txTable').innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; padding: 40px; color: #666;">
                            No transactions in this block
                        </td>
                    </tr>
                `;
            }
        }
        
        function formatNumber(num) {
            if (!num) return '0';
            return num.toLocaleString();
        }
        
        function formatHash(hash) {
            if (!hash) return 'N/A';
            if (typeof hash === 'object') {
                // Convert byte array to hex
                return Array.from(hash).map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 20) + '...';
            }
            if (typeof hash === 'string') {
                // Remove "0x" prefix if present
                const cleanHash = hash.startsWith('0x') ? hash.substring(2) : hash;
                // If hash is longer than 20 characters, truncate it
                if (cleanHash.length > 20) {
                    return cleanHash.substring(0, 10) + '...' + cleanHash.substring(cleanHash.length - 10);
                }
                return cleanHash;
            }
            return 'N/A';
        }
    </script>
</body>
</html>
